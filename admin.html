<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Rosē</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;font-family:'DM Sans',sans-serif;color:#1a1a1a;padding:24px;box-sizing:border-box}
  .card{max-width:420px;text-align:center;background:#fff;border-radius:20px;padding:40px 28px;box-shadow:0 8px 30px rgba(0,0,0,0.08)}
  img{width:120px;margin-bottom:20px}
  h1{font-size:1.3rem;font-weight:500;margin:0 0 12px}
  p{font-size:0.95rem;color:#666;line-height:1.5;margin:0}
</style>
</head>
<body>
  <div class="card">
    <img src="mapos.png" alt="MApos">
    <h1>Servicio suspendido</h1>
    <p>El acceso al panel está suspendido temporalmente. Comunícate con MApos para reactivarlo. Tu información está guardada y no se ha perdido nada.</p>
  </div>
</body>
</html>
